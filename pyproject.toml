[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "morepath"
version = "1.0.0.dev0"
dynamic = ["readme"]
description = "A micro web-framework with superpowers"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{name = "Morepath developers", email = "morepath@googlegroups.com"}]
maintainers = [{name = "Henri Hulski", email = "henri@sancode.it"}]
keywords = ["web", "wsgi", "routing", "morepath"]
classifiers = [
    "Intended Audience :: Developers",
    "Environment :: Web Environment",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 5 - Production/Stable",
]
requires-python = ">= 3.11"
dependencies = [
    "WebOb >= 1.8.7",
    "reg >= 1.0.0.dev0",
    "dectate >= 1.0.0.dev0",
    "importscan >= 1.0.0.dev0"
]

[project.urls]
Documentation = "https://morepath.readthedocs.io"
Repository = "https://github.com/morepath/morepath"
Issues = "https://github.com/morepath/morepath/issues"
Changelog = "https://github.com/morepath/morepath/blob/master/CHANGES.txt"

[project.optional-dependencies]
test = ["pytest >= 8", "pytest-env", "WebTest >= 2.0.14"]
coverage = ["pytest-cov"]
lint = ["ruff"]
docs = ["sphinx < 9.1", "pyyaml", "WebTest >= 2.0.14"]
mypy = ["mypy", "pytest", "types-WebOb", "types-WebTest"]
pyright = ["pyright", "pytest", "types-WebOb", "types-WebTest", "WebTest >= 2.0.14"]

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
morepath = ["py.typed"]

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.txt"]}

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["morepath"]
addopts = ["-vv"]
env = ["RUN_ENV=test"]
filterwarnings = [
    "ignore:'cgi' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
omit = ["morepath/pdbsupport.py", "morepath/tests/*", "morepath/types.py"]
source = ["morepath"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
extend-exclude = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TC", "UP", "RUF"]
ignore = ["E501", "RUF012"]
future-annotations = true

[tool.ruff.lint.isort]
extra-standard-library = ["typing_extensions"]
known-first-party = ["dectate", "importscan", "reg"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["."]
mypy_path = [
    "fixture_packages/base",
    "fixture_packages/entry-point",
    "fixture_packages/no_mp",
    "fixture_packages/no_mp_ns",
    "fixture_packages/no_mp_sub",
    "fixture_packages/ns",
    "fixture_packages/ns2",
    "fixture_packages/sub",
    "fixture_packages/under_score",
]
explicit_package_bases = true
exclude = ["fixture_packages/.*/setup\\.py$"]
warn_unreachable = true
warn_unused_ignores = true

[tool.pyright]
typeCheckingMode = "strict"
extraPaths = [
    "fixture_packages/base",
    "fixture_packages/entry-point",
    "fixture_packages/no_mp",
    "fixture_packages/no_mp_ns",
    "fixture_packages/no_mp_sub",
    "fixture_packages/ns",
    "fixture_packages/ns2",
    "fixture_packages/sub",
    "fixture_packages/under_score",
]
reportPrivateUsage = "none"

[tool.tox]
requires = ["tox>=4"]
env_list = [
    "py311",
    "py312",
    "py313",
    "py314",
    "py315",
    "pypy3",
    "coverage",
    "lint",
    "docs",
    "mypy",
    "pyright",
]
skip_missing_interpreters = true

[tool.tox.env_run_base]
package = "editable"
extras = ["test"]
deps = [
    "-r{tox_root}/requirements/corelibs.txt",
    "-r{tox_root}/requirements/fixtures.txt",
]
commands = [["pytest", "{posargs:morepath}"]]

[tool.tox.env.coverage]
base_python = ["python3.14"]
extras = ["test", "coverage"]
commands = [
    ["pytest", "--cov", "--cov-fail-under=100", "{posargs:morepath}"],
]
[tool.tox.env.lint]
base_python = ["python3.14"]
extras = ["lint"]
commands = [
    ["ruff", "check", "."],
    ["ruff", "format", "--check", "."],
]

[tool.tox.env.docs]
base_python = ["python3.14"]
extras = ["docs"]
commands = [
    ["sphinx-build", "-W", "-b", "doctest", "doc", "{env_tmp_dir}"],
    ["sphinx-build", "-W", "-b", "html", "doc", "{env_tmp_dir}"],
]

[tool.tox.env.mypy]
base_python = ["python3.14"]
extras = ["mypy"]
commands = [
    ["mypy", "--python-version", "3.11"],
    ["mypy", "--python-version", "3.12"],
    ["mypy", "--python-version", "3.13"],
    ["mypy", "--python-version", "3.14"],
    ["mypy", "--python-version", "3.15"],
]

[tool.tox.env.pyright]
base_python = ["python3.14"]
extras = ["pyright"]
commands = [
    ["pyright", "--pythonversion", "3.11"],
    ["pyright", "--pythonversion", "3.12"],
    ["pyright", "--pythonversion", "3.13"],
    ["pyright", "--pythonversion", "3.14"],
    ["pyright", "--pythonversion", "3.15"],
]

[tool.zest-releaser]
release = false
upload-pypi = false
tag-format = "v{version}"
