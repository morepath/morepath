repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.0
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: "7.4.1"
    hooks:
      - id: flake8
        additional_dependencies: [flake8-pyproject, flake8-type-checking]
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    - id: pyupgrade
      args: [--py310-plus]
